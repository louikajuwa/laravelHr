services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hr_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [hrnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: hr_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [hrnet]

  mysql:
    image: mysql:8.4
    container_name: hr_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: laravel_hr
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_secret}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hrnet]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: hr_pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [hrnet]

networks:
  hrnet:
    driver: bridge

volumes:
  mysql_data:
