services:
  # One-shot: hands the writable bind-mounted dirs to the unprivileged `app` user.
  app-init:
    image: laravelhr-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: root
    working_dir: /var/www/html
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache vendor
        && chown -R app:app storage bootstrap/cache vendor
        && chmod -R u+rwX,g+rwX,o-w storage bootstrap/cache
    volumes:
      - ./:/var/www/html
    restart: "no"

  app:
    image: laravelhr-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hr_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      app-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks: [hrnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: hr_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [hrnet]

  # Dev mail catcher for password-reset emails: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: hr_mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks: [hrnet]

  # Frontend build tooling (not started by default):
  #   docker compose run --rm node npm ci
  #   docker compose run --rm node npm run build
  node:
    image: node:22-alpine
    profiles: [tools]
    working_dir: /w
    volumes:
      - ./:/w
    command: ["npm", "run", "build"]

  mysql:
    image: mysql:8.4
    container_name: hr_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: laravel_hr
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_secret}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hrnet]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: hr_pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [hrnet]

networks:
  hrnet:
    driver: bridge

volumes:
  mysql_data:
